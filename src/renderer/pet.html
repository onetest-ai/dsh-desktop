<!doctype html>
<meta charset="utf-8">
<!--
  What this page may load, and from where.

  The pet window is otherwise-empty chrome: one canvas, driven entirely by
  main pushing sprite sheets and state over IPC, plus a small cluster of
  compose/notification controls. `default-src 'none'` starts from nothing,
  and each directive below is here because something this page actually
  does needs it:
  - `script-src 'self'` — `pet-bundle.js`, the only script this page has.
  - `style-src 'self' 'unsafe-inline'` — the harness's own token sheets
    (`theme/base.css`, `theme/design-platform.css`), loaded the same way
    `pane.html` loads them so `--dsw-alias-*` resolves; `'unsafe-inline'` is
    the inline `<style>` block below, which has no remote content to smuggle.
  - `img-src data:` — the spritesheet arrives from main as a data URL, drawn
    to the canvas rather than set as an `<img src>`, but the CSP directive
    that governs `drawImage`'s image source is still `img-src`.
  There is nothing to fetch and no filesystem to reach from here, so every
  other directive stays 'none'.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Pet</title>
<!-- The harness's own tokens, vendored; see vendor/dsh-theme/README.md. Every
     colour in this page — icon glyphs included — comes from these
     `--dsw-alias-*` variables, read either in CSS `var()` here or via
     `getComputedStyle` in pet.ts for the bubble drawn on the canvas. -->
<link rel="stylesheet" href="theme/base.css">
<link rel="stylesheet" href="theme/design-platform.css">
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  /* The whole window lays out as one centered vertical column: the canvas
     (bubble band + sprite) on top, then the DOM chrome below it. This is
     the fix for the compose panel used to sit — floating over the sprite —
     now nothing overlaps it; the panel only ever grows the window downward. */
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* Only the sprite drags the window; the chrome below is normal, `no-drag`
     form controls and never needs the click-vs-drag treatment the old
     overlay did. */
  #pet {
    display: block;
    -webkit-app-region: drag;
    image-rendering: pixelated;
    cursor: grab;
  }
  /* Everything below the canvas: the always-visible icon row, then the
     compose panel when open. Fixed CSS px, not scaled with the sprite —
     ordinary form chrome stays legible even when the pet itself is drawn
     small at `scale: 0.5`. Mirrors `CONTROLS_ROW_H`/`COMPOSE_PANEL_H` in
     `src/main/pet-window.ts` by hand, the same way `BUBBLE_BAND` already is. */
  #pet-chrome {
    box-sizing: border-box;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    -webkit-app-region: no-drag;
  }
  #pet-controls {
    display: flex;
    gap: 10px;
  }
  /* The compose panel occupies the controls row's own slot rather than
     growing past it — pet.ts adds this class to `body` exactly when the
     panel opens, and drops it on close. Hiding the row this way (rather
     than the panel overlapping it) is what keeps the sprite from jumping:
     `#pet-chrome`'s flex `gap` only applies between *visible* children, so
     with the row gone there is nothing left pushing the panel down by an
     extra row's worth of space, and `petComposePanelSize` in
     `src/main/pet-window.ts` sizes the window on that same assumption —
     mirror any change to the row/panel band here there too. */
  body.composing #pet-controls {
    display: none;
  }
  /* One shared shape for the compose pencil and the notification bell: a
     circular token-surfaced button, always visible below the sprite.
     `currentColor` inside the glyph paths is the one place this repo's
     no-literal-colour rule allows it — the class here sets that colour to a
     real token. */
  .pet-icon-btn {
    position: relative;
    -webkit-app-region: no-drag;
    width: 32px;
    height: 32px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    border: 1px solid var(--dsw-alias-border-l2);
    background: var(--dsw-alias-tooltip-bg);
    color: var(--dsw-alias-label-primary);
    cursor: pointer;
  }
  .pet-icon-btn svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* The missed-turn indicator sits on the bell: a small dot at its corner,
     coloured with the app's one accent so it reads as "new" at a glance.
     Hidden whenever `onState` reports no badge. */
  #notify-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: var(--dsw-alias-state-business-primary);
    border: 1px solid var(--dsw-alias-tooltip-bg);
  }
  #notify-badge[hidden] {
    display: none;
  }
  /* The compose panel: one cohesive dark rounded bar, modelled on the
     harness's own composer — a top framing row (workspace + read-only mode),
     the input, and a bottom framing row (read-only model + the accent send
     button). It replaces the controls row while open and only ever grows the
     window downward; the sprite above it never moves.

     The whole bar is a single `bg-layer-2` surface with `label-primary`
     text: both flip together with the theme, so the bar is dark with light
     text in the dark theme (where this app runs) and inverts cleanly in
     light. The input is *transparent* over that same surface rather than a
     lighter box inset into it — that's what makes it read as one bar, not a
     field-inside-a-panel. */
  #compose-panel {
    box-sizing: border-box;
    width: 100%;
    min-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border-radius: 16px;
    border: 1px solid var(--dsw-alias-border-l2);
    background: var(--dsw-alias-bg-layer-2);
    color: var(--dsw-alias-label-primary);
  }
  #compose-panel[hidden] {
    display: none;
  }
  /* Top framing row: the workspace control and, when the plugin reports one,
     the read-only mode label — small and left-aligned, like the reference.
     Present only in the rich (options-arrived) path; hidden for the plain
     fallback, which is just the input and send. */
  #compose-top {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  #compose-top[hidden] {
    display: none;
  }
  /* The workspace control: a folder glyph, the current workspace title, and
     a caret — a real `<select>` sits transparent over the whole thing, so
     clicking it opens the native picker. The one interactive control in the
     framing rows; the mode/model labels beside it are inert. */
  #compose-chip-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    max-width: 60%;
    padding: 3px 6px;
    border-radius: 8px;
    color: var(--dsw-alias-label-secondary);
  }
  #compose-chip-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 11px system-ui, sans-serif;
  }
  /* Two minimal line glyphs (folder, caret); `currentColor` inside the paths
     is the allowed use of it, the class sets the real colour from a token. */
  .compose-glyph {
    flex: none;
    display: flex;
    color: var(--dsw-alias-label-secondary);
  }
  .compose-glyph svg {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .compose-glyph.folder svg {
    width: 13px;
    height: 13px;
  }
  .compose-glyph.caret svg {
    width: 11px;
    height: 11px;
  }
  #compose-project {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }
  /* Read-only mode label — a plain label with no dropdown affordance; it is
     not changeable from here. Dimmed one step below the workspace control. */
  #compose-mode {
    font: 11px system-ui, sans-serif;
    color: var(--dsw-alias-label-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #compose-mode[hidden] {
    display: none;
  }
  /* The input: transparent so it belongs to the one bar. One line tall to
     start (min-height), auto-grown by pet.ts toward `max-height` (a few
     lines) as the message lengthens, then it scrolls. The window is sized
     for the tallest state (`petComposePanelSize`), so growth never clips;
     when the message is short the bar is shorter and the transparent slack
     below it simply isn't painted. */
  #compose-text {
    width: 100%;
    box-sizing: border-box;
    min-height: 44px;
    max-height: 88px;
    resize: none;
    overflow-y: auto;
    border: 0;
    padding: 6px 2px;
    background: transparent;
    font: 15px/1.4 system-ui, sans-serif;
    color: var(--dsw-alias-label-primary);
  }
  #compose-text:focus-visible {
    outline: none;
  }
  #compose-text::placeholder {
    color: var(--dsw-alias-label-tertiary);
  }
  /* Bottom framing row: the read-only model label, then the accent send
     button — right-aligned, framing the input from below like the reference. */
  #compose-bottom {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  #compose-model {
    min-width: 0;
    font: 11px system-ui, sans-serif;
    color: var(--dsw-alias-label-tertiary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #compose-model[hidden] {
    display: none;
  }
  /* The one accent colour in this page: the send button, which carries the
     app's business-primary token rather than a neutral surface. */
  #compose-send {
    flex: none;
    width: 32px;
    height: 32px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    border: none;
    background: var(--dsw-alias-state-business-primary);
    color: var(--dsw-alias-label-primary-foreground);
    cursor: pointer;
  }
  #compose-send svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  :focus-visible {
    outline: 2px solid var(--dsw-alias-state-business-primary);
  }
</style>
<canvas id="pet"></canvas>
<div id="pet-chrome">
  <div id="pet-controls">
    <button id="compose-toggle" class="pet-icon-btn" type="button" title="Send a quick message" aria-label="Compose a message">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3L5 14H2v-3z"/></svg>
    </button>
    <button id="notify-toggle" class="pet-icon-btn" type="button" title="Show the finished turn" aria-label="Show the finished turn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5a4 4 0 0 1 8 0c0 3 1 4 1 4H3s1-1 1-4z"/><path d="M6.5 12.5a1.5 1.5 0 0 0 3 0"/></svg>
      <span id="notify-badge" hidden></span>
    </button>
  </div>
  <div id="compose-panel" hidden>
    <div id="compose-top" hidden>
      <div id="compose-chip-wrap">
        <span class="compose-glyph folder" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M2 5V4a1 1 0 0 1 1-1h2.6l1.2 1.5H13a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg>
        </span>
        <span id="compose-chip-label"></span>
        <span class="compose-glyph caret" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M4 6.5 8 10l4-3.5"/></svg>
        </span>
        <select id="compose-project" aria-label="Project"></select>
      </div>
      <span id="compose-mode" hidden></span>
    </div>
    <textarea id="compose-text" rows="1" spellcheck="false"
              placeholder="Type a message…"
              aria-label="Message to the session"></textarea>
    <div id="compose-bottom">
      <span id="compose-model" hidden></span>
      <button id="compose-send" type="button" aria-label="Send">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4"/></svg>
      </button>
    </div>
  </div>
</div>
<script src="pet-bundle.js"></script>
</content>
</invoke>
