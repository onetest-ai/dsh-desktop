<!doctype html>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="settings.css">
<main>
  <h1>DeepSeek Harness</h1>
  <p id="intro" class="hint"></p>

  <p class="group-label" id="source-label">Where the harness runs from</p>
  <section class="group choices" role="radiogroup" aria-labelledby="source-label">
    <label><input type="radio" name="kind" value="local" checked> A local checkout</label>
    <label><input type="radio" name="kind" value="managed"> A managed install</label>
  </section>

  <section id="local-fields" class="group">
    <label for="repo">Checkout folder</label>
    <div class="row">
      <input id="repo" type="text" placeholder="/path/to/deepseek-harness">
      <button id="browse" type="button">Choose…</button>
    </div>
    <p class="error" id="error-repo"></p>
  </section>

  <section id="managed-fields" class="group" hidden>
    <label for="package">Package</label>
    <input id="package" type="text">
    <p class="error" id="error-package"></p>
    <label for="version">Version</label>
    <input id="version" type="text">
    <p class="error" id="error-version"></p>
    <p class="hint update-hint" id="update-hint" hidden>
      Version <span id="latest-version"></span> is available.
      <button id="use-latest" type="button">Use it</button>
    </p>
    <label for="workspace">Workspace folder</label>
    <div class="row">
      <input id="workspace" type="text" placeholder="defaults to your home folder">
      <button id="browse-workspace" type="button">Choose…</button>
    </div>
    <p class="error" id="error-workspace"></p>
  </section>

  <section class="group">
    <label for="notifyPort">Notification port</label>
    <input id="notifyPort" type="text" inputmode="numeric">
    <p class="error" id="error-notifyPort"></p>

    <label for="hotkey">Show/hide shortcut</label>
    <input id="hotkey" type="text">
    <p class="error" id="error-hotkey"></p>

    <details>
      <summary>Advanced</summary>
      <label for="pnpmPath">pnpm path</label>
      <input id="pnpmPath" type="text" placeholder="found on PATH by default">
      <label for="npmPath">npm path</label>
      <input id="npmPath" type="text" placeholder="found on PATH by default">
    </details>
  </section>

  <p class="group-label" id="plugins-label">Plugins</p>
  <section class="group" aria-labelledby="plugins-label">
    <p class="hint">One package per line: <code>pkg</code> for the latest, offered updates later, or <code>pkg@version</code> to pin it exactly and never be offered an update. The notification hook bridge is pre-seeded below.</p>
    <label for="plugins">Packages</label>
    <textarea id="plugins" rows="4" spellcheck="false"></textarea>
    <p class="error" id="error-plugins"></p>
    <p class="hint" id="plugin-status"></p>
    <div id="plugin-updates"></div>
  </section>

</main>
<div class="actions">
  <div class="actions-status">
    <p class="status" id="status" role="status"></p>
    <pre class="progress" id="progress" role="status" hidden></pre>
  </div>
  <button id="save" type="button">Save</button>
</div>
<script src="settings.js"></script>
