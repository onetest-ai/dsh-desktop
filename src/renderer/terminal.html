<!doctype html>
<meta charset="utf-8">
<title>Terminal</title>
<link rel="stylesheet" href="theme/base.css">
<link rel="stylesheet" href="theme/design-platform.css">
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="terminal.css">
<div class="terminal-chrome">
  <div class="terminal-tabs" id="terminal-tabs"></div>
  <button type="button" id="terminal-new" class="terminal-chrome-button" aria-label="New terminal" title="New terminal">
    <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
  <button type="button" id="terminal-close" class="terminal-chrome-button" aria-label="Close the terminal" title="Close the terminal">
    <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="m2.5 2.5 7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
</div>
<div class="terminal-surfaces" id="terminal-surfaces"></div>
<p class="terminal-message" id="terminal-empty" hidden></p>
<script src="terminal-bundle.js"></script>
