<!doctype html>
<meta charset="utf-8">
<title>Shell</title>
<link rel="stylesheet" href="shell.css">
<!-- One per resizable column. Each is only ever visible in the gap its own
     column leaves, so both can sit here whether or not that column is open. -->
<div class="divider" id="divider-editor" data-column="editor" role="separator" aria-orientation="vertical" aria-label="Resize the editor" tabindex="0"></div>
<div class="divider" id="divider-files" data-column="files" role="separator" aria-orientation="vertical" aria-label="Resize the file tree" tabindex="0"></div>
<script src="shell.js"></script>
