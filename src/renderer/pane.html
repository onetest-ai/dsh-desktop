<!doctype html>
<meta charset="utf-8">
<title>Editor</title>
<link rel="stylesheet" href="pane.css">
<!-- The editor's own styles, emitted beside its bundle. Loaded after the
     pane's so the editor keeps its layout inside the panel it fills. -->
<link rel="stylesheet" href="pane-bundle.css">
<main class="pane">
  <nav class="tabs" role="tablist" aria-label="Editor column">
    <button type="button" role="tab" id="tab-editor" aria-controls="panel-editor" aria-selected="true" class="tab">Editor</button>
    <button type="button" role="tab" id="tab-web" aria-controls="panel-web" aria-selected="false" tabindex="-1" class="tab">Web</button>
    <span class="tab-spacer"></span>
    <button type="button" id="close-editor" class="tab-close" aria-label="Close the editor" title="Close">✕</button>
  </nav>
  <section id="panel-editor" role="tabpanel" aria-labelledby="tab-editor" class="panel">
    <p class="empty" id="editor-empty">Nothing open. Pick a file from the tree, or let the agent open one.</p>
    <div id="editor-host" class="editor" hidden></div>
    <p class="status" id="editor-status" role="status"></p>
  </section>
  <!-- Empty by design: the Web tab's contents are a view of their own,
       stacked over this panel by main. -->
  <section id="panel-web" role="tabpanel" aria-labelledby="tab-web" class="panel"></section>
</main>
<script src="pane-bundle.js"></script>
