<!doctype html>
<meta charset="utf-8">
<title>Editor</title>
<!-- The harness's own tokens, vendored; see vendor/dsh-theme/README.md. -->
<link rel="stylesheet" href="theme/base.css">
<link rel="stylesheet" href="theme/design-platform.css">
<link rel="stylesheet" href="pane.css">
<!-- The editor's own styles, emitted beside its bundle. Loaded after the
     pane's so the editor keeps its layout inside the panel it fills. -->
<link rel="stylesheet" href="pane-bundle.css">
<main class="pane">
  <nav class="tabs" role="tablist" aria-label="Editor column">
    <button type="button" role="tab" id="tab-editor" aria-controls="panel-editor" aria-selected="true" class="tab">Editor</button>
    <button type="button" role="tab" id="tab-web" aria-controls="panel-web" aria-selected="false" tabindex="-1" class="tab">Web</button>
    <button type="button" role="tab" id="tab-board" aria-controls="panel-board" aria-selected="false" tabindex="-1" class="tab">Board</button>
    <span class="tab-spacer"></span>
    <button type="button" id="close-editor" class="tab-close" aria-label="Close the editor" title="Close">✕</button>
  </nav>
  <section id="panel-editor" role="tabpanel" aria-labelledby="tab-editor" class="panel">
    <!-- One entry per open file. Empty, and hidden, until something is. -->
    <div class="file-tabs" id="file-tabs" role="tablist" aria-label="Open files" hidden></div>
    <p class="empty" id="editor-empty">Nothing open. Pick a file from the tree, or let the agent open one.</p>
    <div id="editor-host" class="editor" hidden></div>
    <!-- Rendered markdown, shown instead of the editor for the tabs that
         have a preview. -->
    <article id="preview" class="preview" hidden></article>
    <p class="status" id="editor-status" role="status">
      <span id="status-text"></span>
      <button type="button" id="toggle-preview" class="status-toggle" hidden>Preview</button>
      <!-- Not a toggle: it saves the tab and hands the file to the Web tab,
           which is a view of its own rather than anything in this column. -->
      <button type="button" id="open-in-web" class="status-toggle" hidden>Open in Web</button>
    </p>
  </section>
  <!-- Only the chrome: the page itself is a view of its own, stacked over
       this panel by main, below this bar. -->
  <section id="panel-web" role="tabpanel" aria-labelledby="tab-web" class="panel panel-web">
    <div class="address">
      <button type="button" id="web-back" class="chrome" aria-label="Back" title="Back">‹</button>
      <button type="button" id="web-forward" class="chrome" aria-label="Forward" title="Forward">›</button>
      <button type="button" id="web-reload" class="chrome" aria-label="Reload" title="Reload">⟳</button>
      <input id="web-url" type="text" spellcheck="false" autocomplete="off" aria-label="Address" placeholder="example.com">
    </div>
  </section>
  <!-- The board itself, unlike the web page above: a panel of this document,
       drawn from the same read the tree in the side column uses. -->
  <section id="panel-board" role="tabpanel" aria-labelledby="tab-board" class="panel">
    <p class="empty" id="board-empty" hidden></p>
    <p class="git-note" id="board-note" role="status" hidden></p>
    <!-- The board's own chrome, and the only way to a test that does not
         require knowing the test exists. Hidden while a destination is open,
         because each of those carries its own back. -->
    <div class="board-head" id="board-head" hidden>
      <button type="button" id="board-tests" class="board-head-button">Tests</button>
    </div>
    <div id="board-groups"></div>
    <!-- Closed by its own controls and by nothing else; see the spec's
         "Creating something opens a modal". -->
    <div id="board-modal" class="board-modal" role="dialog" aria-modal="true" aria-labelledby="board-modal-title" hidden>
      <form class="board-modal-form" id="board-modal-form">
        <div class="board-modal-head">
          <p class="board-modal-title" id="board-modal-title"></p>
          <!-- An ordinary button, not a backdrop or an Escape handler: a
               keyboard user leaves the way everyone else does. -->
          <button type="button" id="board-modal-close" class="board-modal-close" aria-label="Close">✕</button>
        </div>
        <label class="board-modal-field"><span>Name</span><input type="text" id="board-modal-name"></label>
        <label class="board-modal-field"><span id="board-modal-second-label"></span><input type="text" id="board-modal-second"></label>
        <p class="board-modal-error" id="board-modal-error" role="status" hidden></p>
        <div class="board-modal-actions">
          <button type="button" id="board-modal-cancel" class="board-modal-button">Cancel</button>
          <button type="submit" id="board-modal-create" class="board-modal-button">Create</button>
        </div>
      </form>
    </div>
  </section>
</main>
<script src="pane-bundle.js"></script>
